<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#2563eb"/>

  <!-- Clock face -->
  <circle cx="16" cy="16" r="12" fill="white"/>

  <!-- Hour markers -->
  <circle cx="16" cy="5.5" r="1" fill="#2563eb"/>
  <circle cx="16" cy="26.5" r="1" fill="#2563eb"/>
  <circle cx="5.5" cy="16" r="1" fill="#2563eb"/>
  <circle cx="26.5" cy="16" r="1" fill="#2563eb"/>

  <!-- Small hour markers -->
  <circle cx="22.5" cy="7.5" r="0.7" fill="#93c5fd"/>
  <circle cx="24.5" cy="11.5" r="0.7" fill="#93c5fd"/>
  <circle cx="24.5" cy="20.5" r="0.7" fill="#93c5fd"/>
  <circle cx="22.5" cy="24.5" r="0.7" fill="#93c5fd"/>
  <circle cx="9.5" cy="7.5" r="0.7" fill="#93c5fd"/>
  <circle cx="7.5" cy="11.5" r="0.7" fill="#93c5fd"/>
  <circle cx="7.5" cy="20.5" r="0.7" fill="#93c5fd"/>
  <circle cx="9.5" cy="24.5" r="0.7" fill="#93c5fd"/>

  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="22" y2="13" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#1e40af"/>
</svg>
