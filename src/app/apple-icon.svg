<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#2563eb"/>

  <!-- Clock face -->
  <circle cx="90" cy="90" r="65" fill="white"/>

  <!-- Hour markers -->
  <circle cx="90" cy="32" r="5" fill="#2563eb"/>
  <circle cx="90" cy="148" r="5" fill="#2563eb"/>
  <circle cx="32" cy="90" r="5" fill="#2563eb"/>
  <circle cx="148" cy="90" r="5" fill="#2563eb"/>

  <!-- Small hour markers -->
  <circle cx="126" cy="44" r="3.5" fill="#93c5fd"/>
  <circle cx="140" cy="68" r="3.5" fill="#93c5fd"/>
  <circle cx="140" cy="112" r="3.5" fill="#93c5fd"/>
  <circle cx="126" cy="136" r="3.5" fill="#93c5fd"/>
  <circle cx="54" cy="44" r="3.5" fill="#93c5fd"/>
  <circle cx="40" cy="68" r="3.5" fill="#93c5fd"/>
  <circle cx="40" cy="112" r="3.5" fill="#93c5fd"/>
  <circle cx="54" cy="136" r="3.5" fill="#93c5fd"/>

  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="90" y1="90" x2="90" y2="50" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="90" y1="90" x2="125" y2="75" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="90" cy="90" r="10" fill="#1e40af"/>
</svg>
